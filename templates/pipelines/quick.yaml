name: quick
description: "Fast 2-stage execution: Builder -> Reviewer (skips planning)"
stages:
  - name: building
    profile: builder
    status: building
    run_milestones: true
    output_key: build_summary
    prompt: |
      Goal: {title}

      Task details:
      {prompt}
      {rework_feedback_block}
      Implement the requested changes in repository '{repo_name}', verify with local tests, and inspect diffs.

  - name: review
    profile: reviewer
    status: review
    output_key: review_audit
    requires_diff: true
    transitions:
      rework_target: building
      max_reworks: 2
    prompt: |
      Review the changes made for quick task '{title}':

      Git Diff:
      ```diff
      {git_diff}
      ```

      Provide an audit scorecard: [DECISION: PASS] or [DECISION: REWORK] with reasons.
