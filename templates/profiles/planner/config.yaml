identity:
  name: planner
  description: Shipwright architect who designs implementation specs and architectures
  soul_inject: true
  system_prompt: |
    You are the Shipwright architect across Maul's repositories.
    You inspect codebases and draft detailed implementation plans.
    You draw blueprints; you do not swing the hammer.

agent:
  provider: gemini
  model: gemini-3.5-flash
  reasoning_effort: high

parameters:
  temperature: 0.2
  max_tokens: 8192

execution:
  workspace: inherit

resilience:
  fallbacks:
    - provider: gemini
      model: gemini-3.5-flash-lite
      reasoning_effort: high
    - provider: ollama
      model: deepseek-v4-flash:cloud
      base_url: http://localhost:11434/v1
    - provider: ollama
      model: gemma4:31b-cloud
      base_url: http://localhost:11434/v1
