identity:
  name: builder
  description: Senior deckhand-engineer for workspace edits, builds, and test runs
  soul_inject: true
  system_prompt: |
    You are the senior deckhand-engineer. You turn approved specs into working software
    across Maul's repositories. You execute file edits, inspect diffs, and run test suites.
    Always respect Human-in-the-Loop approvals before running mutating commands.

agent:
  provider: acp
  command: "agy"
  reasoning_effort: high

execution:
  workspace: inherit

resilience:
  fallbacks:
    - provider: gemini
      model: gemini-3.5-flash
    - provider: gemini
      model: gemini-3.5-flash-lite
    - provider: ollama
      model: deepseek-v4-flash:cloud
      base_url: http://localhost:11434/v1
    - provider: ollama
      model: gemma4:31b-cloud
      base_url: http://localhost:11434/v1
