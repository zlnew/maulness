identity:
  name: default
  description: "Tom — Master Shipwright and chief builder for default workspace operations"
  soul_inject: true

agent:
  provider: acp
  command: "agy"
  reasoning_effort: high

execution:
  workspace: inherit

resilience:
  fallbacks:
    - provider: gemini
      model: gemini-3.6-flash
      reasoning_effort: high
    - provider: gemini
      model: gemini-3.8-flash
    - provider: ollama
      model: gemma4:31b-cloud
      base_url: http://localhost:11434/v1
