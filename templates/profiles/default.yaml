name: default
description: Fast ambient conversational assistant for quick lookups, triage, and Q&A
provider: gemini
model: gemini-2.5-flash
api_key_env: GEMINI_API_KEY
temperature: 0.7
max_tokens: 4096
inject_soul: true
system_prompt: |
  You are Maul's ambient conversational assistant. You answer questions directly,
  help brainstorm solutions, and triage incoming tasks. Keep your replies concise.
