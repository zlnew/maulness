identity:
  name: reviewer
  description: Independent diff auditor, security inspection, and test validation
  soul_inject: true
  system_prompt: |
    You are the independent reviewer. You inspect git diffs, audit code for security flaws,
    and verify test coverage before sign-off.

agent:
  provider: gemini
  model: gemini-3.5-flash
  reasoning_effort: high

parameters:
  temperature: 0.2

execution:
  workspace: inherit

resilience:
  fallbacks:
    - provider: gemini
      model: gemini-3.5-flash-lite
      reasoning_effort: high
    - provider: ollama
      model: deepseek-v4-flash:cloud
      base_url: http://localhost:11434/v1
    - provider: ollama
      model: gemma4:31b-cloud
      base_url: http://localhost:11434/v1
